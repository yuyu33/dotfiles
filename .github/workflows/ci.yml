name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh shellcheck
      - name: shellcheck
        run: shellcheck install.sh macos.sh bin/dot
      - name: zsh syntax
        run: for f in zsh/.zshenv zsh/.zprofile zsh/.zshrc zsh/gh-account.zsh; do zsh -n "$f"; done
      - name: Brewfile syntax
        run: ruby -c Brewfile
      - name: ssh config syntax
        run: ssh -G -F ssh/config github.com > /dev/null
      - name: git config syntax
        run: git config --file config/git/config --list > /dev/null
